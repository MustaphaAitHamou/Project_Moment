# Builds natifs via EAS (déclenchement MANUEL uniquement). Prérequis : secret EXPO_TOKEN,
# projet EAS lié (EAS_PROJECT_ID) et variables d'environnement EAS configurées.
# Ce workflow ne soumet rien aux stores : la soumission reste une décision humaine.
name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profil de build EAS
        type: choice
        options: [preview, production, development]
        default: preview
      platform:
        description: Plateforme
        type: choice
        options: [all, ios, android]
        default: all

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vérifier la présence du jeton Expo
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Secret EXPO_TOKEN absent : configurez-le dans Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Lancer le build (sans attendre la fin)
        working-directory: apps/mobile
        run: eas build --profile "${{ inputs.profile }}" --platform "${{ inputs.platform }}" --non-interactive --no-wait

packages:
  - apps/*
  - packages/*
  - scripts

# Versions partagées entre le web, le mobile et les packages (une seule source de vérité).
catalog:
  typescript: 6.0.3
  zod: 4.6.7
  "@supabase/supabase-js": 2.119.0
  vitest: 5.1.0
  react: 19.3.1
  react-dom: 19.3.1
  date-fns: 4.4.0
  "@date-fns/tz": 1.5.0
  "@tanstack/react-query": 5.107.1
  use-intl: 4.14.10

# Une seule copie de React dans tout le dépôt (indispensable pour React Native / Metro).
overrides:
  react: 19.3.1
  react-dom: 19.3.1

onlyBuiltDependencies:
  - supabase
  - esbuild
  - sharp
  - "@tailwindcss/oxide"
  - unrs-resolver
